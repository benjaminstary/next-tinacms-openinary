name: Publish package

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Set up npm for trusted publishing
        run: npm install --global npm@11.5.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build package
        run: pnpm build

      - name: Verify tag matches package version
        run: |
          node -e "const expected = process.env.GITHUB_REF_NAME.slice(1); const actual = require('./package.json').version; if (expected !== actual) { console.error('Tag ' + expected + ' does not match package version ' + actual); process.exit(1); }"

      - name: Verify package contents
        run: pnpm pack --dry-run

      - name: Publish to npm with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          tag=latest
          case "$version" in
            *-*) tag=beta ;;
          esac
          npm publish --provenance --access public --tag "$tag"
